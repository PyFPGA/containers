name: Deploy Docker Images

on:
  push:
    paths:
      - 'dockerfiles/Dockerfile.langutils'
      - 'dockerfiles/Dockerfile.synthesis'
      - 'dockerfiles/Dockerfile.simulation'
      - 'dockerfiles/Dockerfile.nextpnr-apicula'
      - 'dockerfiles/Dockerfile.nextpnr-icestorm'
      - 'dockerfiles/Dockerfile.nextpnr-trellis'
  schedule:
    - cron: '0 21 * * 5'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - langutils
          - synthesis
          - simulation
          - nextpnr-apicula
          - nextpnr-icestorm
          - nextpnr-trellis
    steps:
    - uses: actions/checkout@v2
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image for ${{ matrix.name }}
      run: docker build -f dockerfiles/Dockerfile.${{ matrix.name }} -t ghcr.io/pyfpga/${{ matrix.name }} .
    - name: Push Docker image for ${{ matrix.name }}
      run: docker push ghcr.io/pyfpga/${{ matrix.name }}
